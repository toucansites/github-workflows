name: Build and Deploy with Toucan

on:
  workflow_call:
    inputs:
      version:
        description: 'Toucan Docker image tag to use'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Toucan build target to use (optional)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare cache and output directories
        run: |
          mkdir -p ./cache
          chmod -R 777 ./cache
          mkdir -p ./dist
          chmod -R 777 ./dist

      - name: Resolve Docker tag
        id: docker-tag
        run: |
          VERSION_INPUT="${{ inputs.version }}"
          if [ -n "$VERSION_INPUT" ] && [ "$VERSION_INPUT" != "latest" ]; then
            if curl --silent --fail "https://registry.hub.docker.com/v2/repositories/toucansites/toucan/tags/${VERSION_INPUT}" > /dev/null; then
              echo "Toucan Docker tag '${VERSION_INPUT}' found."
              echo "tag=${VERSION_INPUT}" >> $GITHUB_OUTPUT
            else
              echo "::warning::Toucan Docker tag '${VERSION_INPUT}' not found. Falling back to 'latest'."
              echo "tag=latest" >> $GITHUB_OUTPUT
            fi
          else
            echo "No version input provided or version is 'latest'. Using 'latest'."
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Restore Docker image cache (non-latest only)
        if: ${{ steps.docker-tag.outputs.tag != 'latest' }}
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: docker-${{ runner.os }}-${{ steps.docker-tag.outputs.tag }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Prepare Docker cache directory
        if: ${{ steps.docker-tag.outputs.tag != 'latest' }}
        run: mkdir -p /tmp/.docker-cache

      - name: Ensure Toucan image (load cache or pull)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.docker-tag.outputs.tag }}"
          IMAGE="toucansites/toucan:${TAG}"
          CACHE_TAR="/tmp/.docker-cache/toucan-${TAG}.tar"

          if [ "$TAG" != "latest" ] && [ -f "$CACHE_TAR" ]; then
            echo "Loading cached image from $CACHE_TAR"
            docker load -i "$CACHE_TAR"
          fi

          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Pulling $IMAGE"
            docker pull "$IMAGE"
            if [ "$TAG" != "latest" ]; then
              echo "Saving $IMAGE to cache tarball"
              mkdir -p /tmp/.docker-cache
              docker save "$IMAGE" -o "$CACHE_TAR"
            fi
          else
            echo "Image $IMAGE already available locally."
          fi

      - name: Run Toucan container and build site
        run: |
          # Build the optional target argument
          TARGET_ARG=""
          if [ -n "${{ inputs.target }}" ]; then
            TARGET_ARG="--target ${{ inputs.target }}"
          fi

          docker create \
            --mount type=bind,source=${{ github.workspace }},target=/site \
            --mount type=bind,source=${{ github.workspace }}/cache,target=/site/cache \
            -w /site \
            --name toucan-build \
            toucansites/toucan:${{ steps.docker-tag.outputs.tag }} generate \
            . \
            $TARGET_ARG

          docker start --attach toucan-build

      - name: Copy generated site from container to host
        run: |
          docker cp toucan-build:/tmp/output/. ./dist
          docker rm toucan-build

      - name: Upload static site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-page:
    needs: build-page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4